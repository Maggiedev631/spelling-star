<style>
/* Layout: one centered phone-width column of soft "sticker" cards on a pastel candy ground; Stella the star mascot reacts to answers */
:root{
  --bg1:#FFEFF6; --bg2:#E9F3FF; --dot:#FFD3E5; --ink:#4A3B6B; --muted:#8C7FA8; --card:#FFFFFF;
  --pink:#FF6FA5; --pink-dk:#E04E88; --pink-lt:#FFE1EE; --mint:#3CCB9C; --mint-lt:#DDF8EE;
  --sun:#FFC93C; --sun-lt:#FFF3CC; --lav:#A68BFF; --lav-lt:#EEE8FF; --bad:#FF6B6B; --line:#F1E4F0;
  --display:"Fredoka","Noto Sans TC",system-ui,sans-serif; --body:"Noto Sans TC",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(var(--dot) 2px,transparent 2.5px) 0 0/26px 26px,linear-gradient(160deg,var(--bg1),var(--bg2));background-attachment:fixed;color:var(--ink);font-family:var(--body);font-size:16px;-webkit-tap-highlight-color:transparent}
.wrap{max-width:520px;margin:0 auto;padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{display:flex;align-items:center;gap:6px;font-family:var(--display);font-weight:700;font-size:23px;line-height:1;white-space:nowrap;flex:none}
.logo svg{width:36px;height:36px;animation:wob 3s ease-in-out infinite}
.logo b{color:var(--pink);font-weight:700}
.who{font-size:13px;color:var(--muted);text-align:right;display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.who b{color:var(--ink)}
.card{background:var(--card);border:3px solid var(--pink-lt);border-radius:28px;padding:20px 18px;box-shadow:0 8px 0 var(--pink-lt),0 14px 30px rgba(166,139,255,.18);position:relative}
h2{font-family:var(--display);font-weight:700;font-size:23px;margin:0 0 10px;text-wrap:balance}
.hello{display:flex;align-items:center;gap:12px}
.hello svg{width:76px;height:76px;flex:none;animation:hop 2.4s ease-in-out infinite}
.hello h2{margin:0}
.bubble{background:var(--sun-lt);border-radius:18px;padding:10px 14px;position:relative;font-weight:700}
.bubble:before{content:"";position:absolute;left:-8px;top:50%;margin-top:-8px;border:8px solid transparent;border-right-color:var(--sun-lt);border-left:0}
.lbl{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.06em;margin:14px 0 6px}
.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.chip{border:2.5px solid var(--line);background:#fff;color:var(--ink);border-radius:18px;padding:10px 8px;font:700 15px var(--body);cursor:pointer;text-align:center;transition:transform .15s,background .15s}
.chip:hover{transform:translateY(-2px)}
.chip small{display:block;font-weight:400;font-size:12px;color:var(--muted);margin-top:2px}
.chip[aria-pressed="true"]{background:var(--pink-lt);border-color:var(--pink);color:var(--pink-dk)}
.chip[aria-pressed="true"]:after{content:" ✓"}
#modes .chip:nth-child(1)[aria-pressed="true"]{background:var(--sun-lt);border-color:var(--sun);color:#9A6A00}
#modes .chip:nth-child(2)[aria-pressed="true"]{background:var(--mint-lt);border-color:var(--mint);color:#1E8A66}
#modes .chip:nth-child(3)[aria-pressed="true"]{background:var(--lav-lt);border-color:var(--lav);color:#6B4FD8}
.btn{border:0;background:var(--pink);color:#fff;border-radius:999px;padding:14px 20px;font:700 19px var(--display);cursor:pointer;box-shadow:0 5px 0 var(--pink-dk);transition:transform .1s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--pink-dk)}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 5px 0 var(--line);border:2.5px solid var(--line)}
.btn.ghost:active{box-shadow:0 1px 0 var(--line)}
.btn.small{font-size:14px;padding:6px 14px;box-shadow:0 3px 0 var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>.btn{flex:1}
input,select,textarea{font:16px var(--body);border:2.5px solid var(--line);border-radius:16px;padding:12px 14px;width:100%;background:#FFFBFD;color:var(--ink)}
input:focus,select:focus,textarea:focus{border-color:var(--pink);outline:none;box-shadow:0 0 0 4px var(--pink-lt)}
:focus-visible{outline:3px solid var(--lav);outline-offset:2px}
.err{color:var(--bad);font-size:14px;min-height:1.2em;margin-top:6px}
.note{font-size:13px;color:var(--muted)}
.stats{display:flex;gap:8px}
.stat{flex:1;border-radius:18px;padding:10px 6px;text-align:center;background:var(--sun-lt)}
.stat:nth-child(2){background:var(--mint-lt)}.stat:nth-child(3){background:var(--lav-lt)}
.stat b{display:block;font:700 26px var(--display);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
/* game */
.hud{display:flex;justify-content:space-between;align-items:center;font-weight:700;gap:8px}
.hud .score{background:var(--sun-lt);border-radius:999px;padding:4px 12px;font-family:var(--display)}
.bar{height:14px;background:var(--pink-lt);border-radius:999px;overflow:hidden;margin-top:10px;position:relative}
.bar i{display:block;height:100%;background:repeating-linear-gradient(45deg,var(--pink) 0 10px,#FF8DB8 10px 20px);border-radius:999px;transition:width .4s}
.prompt{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;padding-top:10px}
.speak{width:100px;height:100px;border-radius:50%;border:0;background:radial-gradient(circle at 35% 30%,#FFE58A,var(--sun));box-shadow:0 6px 0 #E0A800,0 0 0 8px var(--sun-lt);cursor:pointer;display:grid;place-items:center;animation:pulse 2s ease-in-out infinite}
.speak svg{width:46px;height:46px}
.speak:active{transform:translateY(4px);box-shadow:0 2px 0 #E0A800,0 0 0 8px var(--sun-lt)}
.zh{font-size:26px;font-weight:900}
.pos{display:inline-block;background:var(--lav-lt);color:#6B4FD8;border-radius:8px;font-size:13px;padding:1px 6px;margin-right:6px;vertical-align:4px;font-weight:700}
.slots{display:flex;flex-wrap:wrap;justify-content:center;gap:5px;margin:6px 0 4px}
.slot{width:32px;height:40px;border-radius:10px;background:var(--pink-lt);font:700 24px var(--display);display:grid;place-items:center;color:var(--ink)}
.slot.on{background:#fff;border:2.5px solid var(--pink);animation:pop .2s}
.slot.fixed{background:none;width:12px;color:var(--muted)}
.slot.gap{background:none;width:12px}
.slot.hint{border-color:var(--sun);background:var(--sun-lt)}
#answer{font:700 24px var(--display);text-align:center;letter-spacing:1px;margin-top:6px}
.shake{animation:shake .35s}
.fb{min-height:64px;text-align:center;font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center;gap:10px}
.fb svg{width:52px;height:52px;flex:none}
.fb.ok{color:#1E8A66}.fb.no{color:var(--bad)}
.fb .big{display:block;font:700 26px var(--display);color:var(--ink)}
.fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:20}
.fx i{position:absolute;font-style:normal;font-size:22px;animation:fly 1s ease-out forwards}
/* lists */
.lb{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.lb li{display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:8px;background:#FFFBFD;border:2.5px solid var(--line);border-radius:18px;padding:8px 12px}
.lb li.me{border-color:var(--pink);background:var(--pink-lt)}
.rk{font:700 20px var(--display);text-align:center;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--line)}
.lb li:nth-child(1) .rk{background:var(--sun);color:#fff}.lb li:nth-child(2) .rk{background:#C9C3DB;color:#fff}.lb li:nth-child(3) .rk{background:#F2A97B;color:#fff}
.pts{font:700 22px var(--display);font-variant-numeric:tabular-nums;text-align:right;color:var(--pink-dk)}
.pts small{display:block;font:400 11px var(--body);color:var(--muted)}
.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs .chip{flex:1}
.wrong{display:flex;flex-direction:column;gap:6px}
.wrong div{display:flex;justify-content:space-between;gap:10px;background:var(--pink-lt);border-radius:12px;padding:6px 12px}
.wrong b{font-family:var(--display);font-size:19px}
.rate{display:flex;justify-content:center;gap:6px;margin:4px 0 10px}
.rate svg{width:46px;height:46px}
.rate svg.on{animation:pop .4s backwards}
.rate svg:nth-child(2){animation-delay:.15s}.rate svg:nth-child(3){animation-delay:.3s}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left}
.tw{overflow-x:auto}
#qr{display:grid;place-items:center;padding:12px;background:#fff}
.url{word-break:break-all;font-size:13px;background:var(--bg2);padding:8px;border-radius:10px}
.confirm{border:2px dashed var(--bad);border-radius:14px;padding:10px;margin-top:8px}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes wob{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes fly{0%{opacity:1;transform:translate(0,0) scale(.6)}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(1.2) rotate(200deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

let voice=null;
function pickVoice(){const vs=speechSynthesis.getVoices();voice=vs.find(v=>/en[-_]US/i.test(v.lang)&&/samantha|google|aria|jenny/i.test(v.name))||vs.find(v=>/en[-_]US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null}
if("speechSynthesis" in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function speak(w,slow){
  if(!("speechSynthesis" in window)) return false;
  speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(SAY[w]||w); u.lang="en-US"; if(voice)u.voice=voice; u.rate=slow?0.55:0.85; speechSynthesis.speak(u); return true;
}
const speakerSVG=`<svg viewBox="0 0 24 24" fill="none" stroke="#1B2A4A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="#1B2A4A"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>`;

/* ---------- 遊戲 ---------- */
function gameView(unit,mode){
  const M=MODES[mode]; const qs=shuffle(WORDS[me.book][unit].list).slice(0,ROUND_SIZE);
  let i=0, score=0, tries=0, hints=0, correct=0, locked=false; const wrong=[]; const t0=Date.now();
  view.innerHTML=`<div class="card">
    <div class="hud"><span id="prog"></span><span class="score">⭐ <span id="sc">0</span> 分</span><button class="btn ghost small" id="quit">離開</button></div>
    <div class="bar"><i id="barf" style="width:0"></i></div>
    <div class="prompt" id="prompt"></div>
    <div class="slots" id="slots"></div>
    <input id="answer" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="在這裡拼出單字">
    <div class="fb" id="fb"></div>
    <div class="row"><button class="btn ghost" id="hint">提示 −${HINT_COST}</button><button class="btn" id="ok">送出</button></div>
  </div>`;
  $("#quit").onclick=()=>{speechSynthesis?.cancel();route()};
  const inp=$("#answer");
  function render(){
    const [w,p,z]=qs[i]; tries=0; hints=0; locked=false; inp.value=""; $("#fb").className="fb"; $("#fb").textContent="";
    $("#prog").textContent=`第 ${i+1} / ${qs.length} 題`; $("#barf").style.width=(i/qs.length*100)+"%";
    const showZh=mode!=="listen", showSp=mode!=="zh";
    $("#prompt").innerHTML=(showSp?`<button class="speak" id="say" aria-label="播放發音">${speakerSVG}</button><div class="row" style="justify-content:center"><button class="btn ghost small" id="slow">慢慢唸</button></div>`:"")+
      (showZh?`<div class="zh">${p?p.split(" ").map(x=>`<span class="pos">${x}</span>`).join(""):""}${esc(z)}</div>`:"");
    if(showSp){$("#say").onclick=()=>{speak(w)||noVoice()};$("#slow").onclick=()=>speak(w,true);speak(w)}
    drawSlots(); inp.focus();
  }
  function noVoice(){$("#fb").className="fb no";$("#fb").textContent="這台裝置不能播放發音，請改玩「看中文拼字」"}
  function letters(s){return s.replace(/[^a-zA-Z]/g,"")}
  function drawSlots(hintN){
    const w=qs[i][0]; const typed=letters(inp.value); let k=0;
    $("#slots").innerHTML=[...w].map(ch=>{
      if(/[a-zA-Z]/.test(ch)){const c=typed[k]||"";const h=k<hints;k++;return `<span class="slot${c?" on":""}${h?" hint":""}">${esc(c)}</span>`}
      if(ch===" ") return `<span class="slot gap"></span>`;
      return `<span class="slot fixed">${esc(ch)}</span>`;
    }).join("");
  }
  inp.oninput=()=>drawSlots();
  inp.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();submit()}};
  $("#ok").onclick=submit;
  $("#hint").onclick=()=>{
    if(locked||waiting)return; const w=qs[i][0]; const L=letters(w); if(hints>=L.length-1)return;
    hints++; // 顯示正確的前 hints 個字母（含中間的空格符號）
    let k=0,out=""; for(const ch of w){if(k>=hints)break; out+=ch; if(/[a-zA-Z]/.test(ch))k++}
    inp.value=out; drawSlots(); inp.focus();
  };
  let waiting=false;
  function submit(){
    if(waiting){waiting=false;$("#ok").textContent="送出";return next()}
    if(locked)return; const [w]=qs[i]; const fbEl=$("#fb");
    if(!inp.value.trim()){inp.focus();return}
    if(norm(inp.value)===norm(w)){
      const base=tries===0?M.full:M.half; const got=Math.max(0,base-hints*HINT_COST); score+=got; correct++; locked=true;
      fbEl.className="fb ok"; fbEl.innerHTML=`${star("wow")}<span><span class="big">${esc(w)}</span>答對了！+${got} 分</span>`; burst(); $("#sc").textContent=score;
      if(mode==="zh")speak(w);
      setTimeout(next,1300);
    }else{
      tries++;
      if(tries<2){fbEl.className="fb no";fbEl.innerHTML=`${star("sad")}<span>差一點點！再試一次</span>`;const c=$("#app .card");c.classList.remove("shake");void c.offsetWidth;c.classList.add("shake");inp.select()}
      else{locked=true;waiting=true;wrong.push(qs[i]);fbEl.className="fb no";fbEl.innerHTML=`${star("sad")}<span>正確答案是<span class="big">${esc(w)}</span></span>`;speak(w);$("#ok").textContent="下一題"}
    }
  }
  function next(){i++; if(i>=qs.length) return finish(); render()}
  async function finish(){
    const ms=Date.now()-t0; $("#barf").style.width="100%";
    const rec={sid:me.id,name:me.name,book:me.book,unit,key:me.book+"_"+unit,mode,score,correct,total:qs.length,ms,at:Date.now()};
    let saved=true;
    if(ONLINE){try{
      await fb.db.collection("scores").add(rec);
      await fb.db.collection("totals").doc(me.id).set({name:me.name,book:me.book,points:fb.FV.increment(score),rounds:fb.FV.increment(1),updatedAt:Date.now()},{merge:true});
    }catch(e){saved=false}}
    else{const L=store.get("amc_spell_local")||[];L.push(rec);store.set("amc_spell_local",L)}
    resultView(rec,wrong,saved);
  }
  render();
}

function resultView(r,wrong,saved){
  const max=r.total*MODES[r.mode].full; const pct=r.score/max;
  const msg=pct>=.9?"太厲害了！拼字之星就是你！":pct>=.7?"很棒！再玩一次衝更高分":pct>=.4?"不錯喔，把錯的字再看一次":"多練幾次就會越來越熟！";
  const n=pct>=.9?3:pct>=.6?2:pct>=.3?1:0;
  view.innerHTML=`<div class="card"><div class="rate">${[1,2,3].map(k=>starIcon(k<=n)).join("")}</div><div class="hello">${star(n>=2?"wow":n?"happy":"sad")}<div class="bubble">${msg}</div></div><div style="height:12px"></div>
    <div class="stats"><div class="stat"><b>${r.score}</b><span>本回得分 / ${max}</span></div><div class="stat"><b>${r.correct}/${r.total}</b><span>答對題數</span></div><div class="stat"><b>${Math.round(r.ms/1000)}s</b><span>花費時間</span></div></div>
    ${saved?"":`<p class="err">分數沒有存到排行榜（網路問題），請截圖給老師。</p>`}
    ${wrong.length?`<div class="lbl">要再複習的單字</div><div class="wrong">${wrong.map(([w,p,z])=>`<div><b>${esc(w)}</b><span>${esc(z)}</span></div>`).join("")}</div>`:`<p class="note">全部第一次或第二次就答對，沒有錯字！</p>`}
    <div class="row" style="margin-top:14px"><button class="btn" id="again">再玩一次</button><button class="btn ghost" id="board">排行榜</button></div>
    <button class="btn ghost small" id="home" style="margin-top:10px">回首頁</button></div>`;
  $("#again").onclick=()=>gameView(r.unit,r.mode); $("#board").onclick=()=>boardView(r.unit); $("#home").onclick=route;
}

  async function load(){
    const lb=$("#lb"); let rows=[];
    try{
      if(tab==="best"){
        let recs; if(ONLINE){const s=await fb.db.collection("scores").where("key","==",me.book+"_"+unit).get();recs=s.docs.map(d=>d.data())}else recs=(store.get("amc_spell_local")||[]).filter(r=>r.key===me.book+"_"+unit);
        const best={}; for(const r of recs){const b=best[r.sid]; if(!b||r.score>b.score||(r.score===b.score&&r.ms<b.ms))best[r.sid]=r}
        rows=Object.values(best).sort((a,b)=>b.score-a.score||a.ms-b.ms).map(r=>({sid:r.sid,name:r.name,v:r.score,sub:`${MODES[r.mode]?.name||""}・${Math.round(r.ms/1000)} 秒`}));
      }else{
        if(ONLINE){const s=await fb.db.collection("totals").where("book","==",me.book).get();rows=s.docs.map(d=>({sid:d.id,...d.data()}))}
        else{const m={};for(const r of store.get("amc_spell_local")||[]){if(r.book!==me.book)continue;m[r.sid]=m[r.sid]||{sid:r.sid,name:r.name,points:0,rounds:0};m[r.sid].points+=r.score;m[r.sid].rounds++}rows=Object.values(m)}
        rows=rows.sort((a,b)=>b.points-a.points).map(r=>({sid:r.sid,name:r.name,v:r.points,sub:`玩了 ${r.rounds} 回`}));
      }
    }catch(e){lb.innerHTML=`<li><span></span><span class="err">排行榜載入失敗，請稍後再試。</span><span></span></li>`;return}
    lb.innerHTML=rows.length?rows.slice(0,30).map((r,k)=>`<li class="${r.sid===me.id?"me":""}"><span class="rk">${k+1}</span><span><b>${esc(r.name)}</b>${r.sid===me.id?"（你）":""}<br><span class="note">${esc(r.sub)}</span></span><span class="pts">${r.v}<small>分</small></span></li>`).join(""):`<li><span></span><span class="note">還沒有人上榜，快去搶第一名！</span><span></span></li>`;
  }

}

    const s=await fb.db.collection("scores").where("book","==",book).get();
    const r=s.docs.map(d=>d.data()).sort((a,b)=>b.at-a.at).slice(0,40);
    $("#recent").innerHTML=`<tr><th>時間</th><th>名字</th><th>課</th><th>玩法</th><th>分數</th><th>答對</th></tr>`+r.map(x=>`<tr><td>${new Date(x.at).toLocaleString("zh-TW",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"})}</td><td>${esc(x.name)}</td><td>${esc(WORDS[x.book]?.[x.unit]?.title||x.unit)}</td><td>${esc(MODES[x.mode]?.name||"")}</td><td>${x.score}</td><td>${x.correct}/${x.total}</td></tr>`).join("")+(r.length?"":`<tr><td colspan="6" class="note">還沒有成績</td></tr>`);
  }
  $("#add").onclick=async()=>{
    const err=$("#terr");err.textContent="";const lines=$("#bulk").value.split("\n").map(l=>l.trim()).filter(Boolean);const bad=[];let n=0;
    for(const l of lines){const m=l.match(/^(.+?)[,，\s]+(\d{4})$/);if(!m){bad.push(l);continue}const name=m[1].trim();await fb.db.collection("roster").add({name,book,pin:await sha(book+"|"+name+"|"+m[2])});n++}
    $("#bulk").value=bad.join("\n"); err.textContent=(n?`已加入 ${n} 位。`:"")+(bad.length?`有 ${bad.length} 行格式不對，請改成「名字, 4位數字」。`:""); loadRoster();
  };
  $("#clr").onclick=()=>{$("#cbox").innerHTML=`<div class="confirm">會刪掉 ${book} 所有成績和累積積分（名單保留）。<div class="row" style="margin-top:8px"><button class="btn small" id="yes" style="background:var(--bad)">確定清除</button><button class="btn ghost small" id="no">取消</button></div></div>`;
    $("#no").onclick=()=>$("#cbox").innerHTML="";
    $("#yes").onclick=async()=>{for(const col of ["scores","totals"]){const s=await fb.db.collection(col).where("book","==",book).get();for(const d of s.docs)await d.ref.delete()}$("#cbox").innerHTML=`<p class="note">已清除 ✓</p>`;loadRecent()}};
  loadRoster(); loadRecent();
}
function studentURL(){return location.href.split("#")[0]}
function qrBlock(){return `<div id="qr"></div><p class="url" id="qurl">${esc(studentURL())}</p><p class="note">截圖或印出這個 QR code 給學生，掃了就會打開遊戲。</p>`}
function drawQR(){const el=$("#qr");if(!el)return;if(window.QRCode){el.innerHTML="";new QRCode(el,{text:studentURL(),width:220,height:220,colorDark:"#1B2A4A",colorLight:"#ffffff"})}else el.innerHTML=`<p class="note">QR code 產生器沒有載入</p>`}

/* ---------- 路由 ---------- */
function route(){
  if(location.hash==="#teacher") return teacherView();
  if(!me) return loginView();
  if(!WORDS[me.book]){me=null;return loginView()}
  homeView();
}
window.addEventListener("hashchange",route);
(async()=>{try{await initFirebase()}catch(e){view.innerHTML=`<div class="card"><p class="err">連線失敗，請檢查網路後重新整理。</p></div>`;return} route()})();
</script>
